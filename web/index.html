<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="かわいい犬がタスクを食べてくれるWebアプリ"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://to-dog-list.faveo-systema.net" />
    <meta property="og:title" content="To Dog List" />
    <meta
      property="og:image"
      content="https://to-dog-list.faveo-systema.net/thumbnail.png"
    />
    <meta
      property="og:description"
      content="かわいい犬がタスクを食べてくれるWebアプリ"
    />
    <title>To Dog List</title>
    <!--
      next-themes の inline script は React が描くので、クライアントだけの描画では動かない。
      最初の描画より前に同じ処理をして、ダークで保存した人に明るい画面が一瞬出るのを防ぐ。
      main.tsx の ThemeProvider（attribute="class"、storageKey と defaultTheme は既定の
      'theme' と 'system'、enableSystem）に合わせてあるので、そちらを変えたらここも直す
    -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme') || 'system'
          if (t === 'system')
            t = matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          var e = document.documentElement
          e.classList.remove('light', 'dark')
          e.classList.add(t)
          if (t === 'light' || t === 'dark') e.style.colorScheme = t
        } catch (_) {}
      })()
    </script>

    <link rel="icon" href="./icon.ico" />
  </head>
  <body
    class="min-h-dvh w-full self-center text-black dark:text-white bg-linear-to-b from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-900"
  >
    <main>
      <div id="root" />
    </main>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
